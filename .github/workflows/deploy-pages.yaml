name: Deploy Pages

# Publishes the documentation + UI-guide site in site/ to GitHub Pages.
#
# The site is plain static HTML/CSS/JS. This workflow (re)generates the two
# derived artifacts before publishing so the deployed site always matches the
# sources that are the single source of truth:
#   - site/assets/css/app.css  is rebuilt from the extension Tailwind theme
#     (styles/tailwind.css) by site/build-css.mjs, so the UI mockups match the
#     real extension.
#   - site/docs/*.md           is refreshed from wiki/ by site/sync-docs.mjs,
#     so the docs on the site are exactly the wiki pages.
#
# ONE-TIME SETUP (required once, in the repository on GitHub):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# No branch or /docs folder selection is needed with the Actions source.
#
# Trigger: pushes to main that touch the site, the wiki, the extension theme,
# or the surface HTML the mockups mirror; plus a manual run.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'wiki/**'
      - 'styles/tailwind.css'
      - 'panel/panel.html'
      - 'viewer/viewer.html'
      - 'settings/settings.html'
      - '.github/workflows/deploy-pages.yaml'
  workflow_dispatch:

# Least-privilege permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site CSS from the extension theme
        run: node site/build-css.mjs

      - name: Sync docs from wiki/
        run: node site/sync-docs.mjs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
