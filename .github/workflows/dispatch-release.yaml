name: Dispatch Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      prerelease_suffix:
        description: 'Pre-release suffix (e.g. beta.1, rc.1) — leave blank for a stable release'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute new version
        id: version
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT"

          # Strip any existing pre-release suffix before splitting
          IFS='.' read -r MAJOR MINOR PATCH <<< "$(echo "$CURRENT" | sed 's/-.*//')"

          BUMP="${{ inputs.bump }}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          # Trim whitespace from suffix input
          SUFFIX="${{ inputs.prerelease_suffix }}"
          SUFFIX="$(echo "$SUFFIX" | xargs || true)"

          if [ -n "$SUFFIX" ]; then
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-${SUFFIX}"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          NEW_TAG="v${NEW_VERSION}"
          # manifest.json only accepts numeric X.Y.Z — strip suffix
          MANIFEST_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "New version:      $NEW_VERSION"
          echo "New tag:          $NEW_TAG"
          echo "Manifest version: $MANIFEST_VERSION"

          echo "new_version=$NEW_VERSION"           >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG"                   >> "$GITHUB_OUTPUT"
          echo "manifest_version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tag does not already exist
        run: |
          TAG="${{ steps.version.outputs.new_tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Choose a different bump type or delete the existing tag first."
            exit 1
          fi

      - name: Bump package.json
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = process.env.NEW_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Bump manifest.json
        env:
          MANIFEST_VERSION: ${{ steps.version.outputs.manifest_version }}
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = process.env.MANIFEST_VERSION;
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "

      - name: Commit and push version bump
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push origin main

      - name: Create and push tag
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          git tag "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Tagged and pushed $NEW_TAG — release.yaml will now build and publish the release."
