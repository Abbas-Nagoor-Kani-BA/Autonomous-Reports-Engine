<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bulk SCTASK Update</title>
    <link href="../styles/output.css" rel="stylesheet" />
  </head>
  <body class="m-0 p-4 text-[13px] leading-normal font-sans bg-bg text-text">
    <header class="flex items-center justify-between mb-4">
      <h1 class="text-[16px] m-0 text-accent font-semibold">Bulk SCTASK Update</h1>
      <span id="connState" class="badge">&nbsp;</span>
    </header>

    <section class="flex items-center gap-3 mb-3">
      <label class="pnLabel m-0" for="scope">Scope</label>
      <select id="scope" class="select w-auto">
        <option value="me">Assigned to me</option>
        <option value="groups">Assigned to my groups</option>
      </select>
      <button id="refreshBtn" type="button" class="btn-ghost">Refresh</button>
      <input
        id="search"
        type="search"
        placeholder="Search all columns…"
        class="input w-56"
        aria-label="Search SCTASKs"
      />
      <span id="selCount" class="text-dim ml-auto"></span>
    </section>

    <section id="listWrap" class="bg-card2 rounded-lg p-2 min-h-[120px]">
      <div id="listStatus" class="text-dim p-3">Loading…</div>
      <table id="sctaskTable" class="hidden w-full border-collapse text-left"></table>
    </section>

    <section class="mt-4 grid gap-3">
      <div>
        <label class="pnLabel" for="comments">Comments (customer-visible)</label>
        <textarea
          id="comments"
          class="textarea w-full"
          rows="3"
          placeholder="Applied to all selected SCTASKs unless a ticket has its own text"
        ></textarea>
      </div>
      <div>
        <div class="flex items-center justify-between">
          <label class="pnLabel m-0" for="workNotes">Work notes (internal)</label>
          <button id="copyLastBtn" type="button" class="linklike" disabled>
            Pull last work notes
          </button>
        </div>
        <textarea
          id="workNotes"
          class="textarea w-full"
          rows="3"
          placeholder="Applied to all selected SCTASKs unless a ticket has its own text"
        ></textarea>
      </div>
      <div class="flex justify-end">
        <button id="flagBtn" type="button" class="btn-ghost mr-auto">
          Flag tasks with no work note
        </button>
        <button id="selectFlaggedBtn" type="button" class="btn-ghost mr-2" disabled>
          Select flagged
        </button>
        <button id="updateBtn" type="button" class="btn-primary" disabled>
          Preview &amp; Update
        </button>
      </div>
    </section>

    <!-- Per-ticket override popup (Task 12). Task 8 adds the confirm modal. -->
    <div
      id="overrideModal"
      class="hidden fixed inset-0 z-[9999] flex items-center justify-center bg-card2/70"
    >
      <div class="w-[min(520px,94vw)] bg-card border border-line rounded-xl p-4">
        <div class="flex items-center justify-between mb-2">
          <div id="overrideTitle" class="font-semibold text-muted text-[12.5px]">Edit SCTASK</div>
          <button id="overrideClose" type="button" class="linklike" aria-label="Close">
            &#10005;
          </button>
        </div>
        <label class="pnLabel" for="ovComments">Comments (customer-visible)</label>
        <textarea id="ovComments" class="textarea w-full" rows="3"></textarea>
        <label class="pnLabel" for="ovWorkNotes">Work notes (internal)</label>
        <textarea id="ovWorkNotes" class="textarea w-full" rows="3"></textarea>
        <div class="flex gap-2 justify-end mt-3">
          <button id="overrideClear" type="button" class="linklike">Clear override</button>
          <button id="overrideCancel" type="button" class="linklike">Cancel</button>
          <button id="overrideSave" type="button" class="btn-primary">Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="./index.js"></script>
    <!-- Confirm + progress + summary modal (Task 8). -->
    <div
      id="confirmModal"
      class="hidden fixed inset-0 z-[9999] flex items-center justify-center bg-card2/70"
    >
      <div class="w-[min(640px,94vw)] max-h-[85vh] bg-card border border-line rounded-xl p-4 flex flex-col overflow-hidden">
        <div class="flex items-center justify-between mb-2">
          <div id="confirmTitle" class="font-semibold text-muted text-[13px]">Confirm bulk update</div>
          <button id="confirmClose" type="button" class="linklike" aria-label="Close">&#10005;</button>
        </div>
        <div id="confirmIntro" class="text-dim text-[12px] mb-2"></div>
        <div id="confirmList" class="overflow-y-auto text-[12px] flex-1 border border-line rounded-lg p-2"></div>
        <div id="confirmSummary" class="hidden text-[12.5px] font-semibold mt-2"></div>
        <div class="flex gap-2 justify-end mt-3">
          <button id="retryFailedBtn" type="button" class="btn-ghost hidden">Retry failed</button>
          <button id="confirmCancel" type="button" class="linklike">Cancel</button>
          <button id="confirmPost" type="button" class="btn-primary">Post</button>
          <button id="confirmDone" type="button" class="btn-primary hidden">Done</button>
        </div>
      </div>
    </div>
  </body>
</html>
